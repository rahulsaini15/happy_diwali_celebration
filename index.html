<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Diwali 🪔</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Poppins:wght@300;400;600&display=swap');

        :root {
            --royal-purple: #1a0b2e;
            --deep-navy: #0a0f24;
            --gold: #f4d03f;
            --gold-glow: rgba(244, 208, 63, 0.6);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at center, var(--royal-purple) 0%, var(--deep-navy) 100%);
            color: white;
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- MAIN UI STYLES --- */
        #main-ui {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 2rem;
            position: relative;
            z-index: 10;
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-size: 3.5rem;
            color: var(--gold);
            text-shadow: 0 0 20px var(--gold-glow);
            margin-bottom: 2rem;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeUp 1.5s ease forwards 0.5s;
        }

        .diya-container {
            position: relative;
            width: 120px;
            height: 120px;
            margin-bottom: 3rem;
        }

        .diya-base {
            width: 100px;
            height: 40px;
            background: linear-gradient(135deg, #b8860b, #ffd700, #b8860b);
            border-radius: 0 0 50px 50px;
            position: absolute;
            bottom: 0;
            left: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        .flame {
            width: 30px;
            height: 50px;
            background: radial-gradient(ellipse at bottom, #fff 10%, #ffd700 40%, #ff4500 80%, transparent 100%);
            border-radius: 50% 50% 20% 20% / 60% 60% 30% 30%;
            position: absolute;
            bottom: 35px;
            left: 45px;
            filter: drop-shadow(0 0 20px #ff4500);
            transform-origin: bottom center;
            animation: flicker 3s infinite alternate;
        }

        .action-btn {
            background: transparent;
            border: 2px solid var(--gold);
            color: var(--gold);
            padding: 15px 30px;
            font-size: 1.2rem;
            font-family: 'Cinzel', serif;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px transparent;
            z-index: 20;
        }

        .action-btn:hover {
            background: var(--gold);
            color: var(--deep-navy);
            box-shadow: 0 0 25px var(--gold-glow);
            transform: scale(1.05);
        }

        .controls {
            margin-top: 1.5rem;
            display: none;
        }

        .controls button {
            background: none;
            border: none;
            color: var(--gold);
            font-size: 2rem;
            cursor: pointer;
            margin: 0 10px;
        }

        /* Sparkles Canvas */
        #sparkles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* --- ADMIN UI STYLES --- */
        #admin-ui {
            padding: 2rem;
            max-width: 1000px;
            margin: 0 auto;
        }

        .admin-header {
            color: var(--gold);
            font-family: 'Cinzel', serif;
            text-align: center;
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--gold);
            padding-bottom: 1rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 1.5rem;
            border-radius: 10px;
            border: 1px solid rgba(244, 208, 63, 0.2);
            text-align: center;
        }

        .stat-card h3 {
            font-size: 0.9rem;
            color: #aaa;
            margin-bottom: 0.5rem;
        }

        .stat-card .value {
            font-size: 2rem;
            color: var(--gold);
            font-weight: 600;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            overflow: hidden;
        }

        th, td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        th {
            background: rgba(244, 208, 63, 0.1);
            color: var(--gold);
        }

        /* Animations */
        @keyframes flicker {
            0% { transform: scale(1) rotate(-2deg); opacity: 0.9; }
            50% { transform: scale(1.05) rotate(2deg); opacity: 1; }
            100% { transform: scale(0.95) rotate(-1deg); opacity: 0.8; }
        }

        @keyframes fadeUp {
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 600px) {
            h1 { font-size: 2.2rem; }
            .action-btn { font-size: 1rem; padding: 12px 24px; }
            table { font-size: 0.8rem; }
            th, td { padding: 0.5rem; }
        }
    </style>
</head>
<body>

    <!-- MAIN FESTIVE UI -->
    <div id="main-ui">
        <canvas id="sparkles"></canvas>
        <div class="diya-container">
            <div class="flame"></div>
            <div class="diya-base"></div>
        </div>
        
        <h1>Happy Diwali 🪔</h1>
        
        <button id="playBtn" class="action-btn">Light up the celebration</button>
        
        <div id="controls" class="controls">
            <button id="pauseBtn">⏸</button>
            <button id="resumeBtn" style="display:none;">▶</button>
        </div>
    </div>

    <!-- ADMIN DASHBOARD UI (Hidden by default) -->
    <div id="admin-ui" style="display: none;">
        <h2 class="admin-header">Diwali Analytics Dashboard</h2>
        
        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total Visits</h3>
                <div class="value" id="totalVisits">0</div>
            </div>
            <div class="stat-card">
                <h3>Unique Visitors</h3>
                <div class="value" id="uniqueVisitors">0</div>
            </div>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Date & Time</th>
                    <th>Location</th>
                    <th>Device</th>
                    <th>Referrer</th>
                </tr>
            </thead>
            <tbody id="visitorTableBody">
                <tr><td colspan="4" style="text-align: center;">Loading data...</td></tr>
            </tbody>
        </table>
    </div>

    <!-- FIREBASE AND APP LOGIC -->
    <script type="module">
        // 1. IMPORT FIREBASE (Modular SDK)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // =========================================================================
        // ⚠️ REPLACE THIS OBJECT WITH YOUR FIREBASE CONFIG FROM THE CONSOLE
        // =========================================================================
        const firebaseConfig = {
           apiKey: "AIzaSyDCvotQ8nrRxh98GgeHzFjQPr7g69fid50",
  authDomain: "chatbot-bc902.firebaseapp.com",
  projectId: "chatbot-bc902",
  storageBucket: "chatbot-bc902.firebasestorage.app",
  messagingSenderId: "212169977986",
  appId: "1:212169977986:web:a4795f15a052e20ac9849b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // =========================================================================
        // ROUTING LOGIC: ADMIN VS VISITOR
        // =========================================================================
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const isAdmin = urlParams.get('admin') === 'true';

            const mainUI = document.getElementById('main-ui');
            const adminUI = document.getElementById('admin-ui');

            if (isAdmin) {
                const password = prompt("Enter Admin Password:");
                if (password === "admin123") {
                    mainUI.style.display = 'none';
                    adminUI.style.display = 'block';
                    loadAdminData();
                } else {
                    alert("Incorrect password.");
                    window.location.href = '/';
                }
            } else {
                initMainUI();
                logVisitorData();
            }
        });

        // =========================================================================
        // TRACKING LOGIC (SILENT IP TRACKING + FIREBASE PUSH)
        // =========================================================================
        async function logVisitorData() {
            // Get or create unique visitor ID
            let visitorId = localStorage.getItem('diwali_visitor_id');
            const isNewVisitor = !visitorId;
            if (!visitorId) {
                visitorId = 'uuid-' + Math.random().toString(36).substr(2, 9);
                localStorage.setItem('diwali_visitor_id', visitorId);
            }

            // Detect Device
            const ua = navigator.userAgent;
            let deviceType = "Desktop";
            if (/Mobi|Android|iPhone/i.test(ua)) deviceType = "Mobile";
            if (/Tablet|iPad/i.test(ua)) deviceType = "Tablet";

            // Get Referrer
            const referrer = document.referrer || "Direct (Instagram/Bio)";

            let locationData = { city: "Unknown", country: "Unknown" };

            // Fetch IP location silently
            try {
                const response = await fetch('https://ipapi.co/json/');
                if (response.ok) {
                    const ipData = await response.json();
                    locationData = {
                        city: ipData.city || "Unknown",
                        country: ipData.country_name || "Unknown"
                    };
                }
            } catch (error) {
                console.error("IP tracking blocked or failed:", error);
            }

            // Save to Firebase
            try {
                await addDoc(collection(db, "visitors"), {
                    visitorId: visitorId,
                    isNewVisitor: isNewVisitor,
                    device: deviceType,
                    browser: navigator.appName,
                    city: locationData.city,
                    country: locationData.country,
                    referrer: referrer,
                    timestamp: serverTimestamp(),
                    localTime: new Date().toLocaleString()
                });
                console.log("Visit logged successfully.");
            } catch (e) {
                console.error("Error adding document to Firebase: ", e);
            }
        }

        // =========================================================================
        // ADMIN DASHBOARD LOGIC
        // =========================================================================
        async function loadAdminData() {
            try {
                const q = query(collection(db, "visitors"), orderBy("timestamp", "desc"));
                const querySnapshot = await getDocs(q);
                
                const tableBody = document.getElementById('visitorTableBody');
                tableBody.innerHTML = ''; 
                
                let total = 0;
                let uniqueIds = new Set();

                querySnapshot.forEach((doc) => {
                    total++;
                    const data = doc.data();
                    if(data.visitorId) uniqueIds.add(data.visitorId);

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${data.localTime || "Just now"}</td>
                        <td>${data.city}, ${data.country}</td>
                        <td>${data.device}</td>
                        <td>${data.referrer.substring(0, 30)}</td>
                    `;
                    tableBody.appendChild(tr);
                });

                document.getElementById('totalVisits').innerText = total;
                document.getElementById('uniqueVisitors').innerText = uniqueIds.size;

                if(total === 0) {
                    tableBody.innerHTML = '<tr><td colspan="4" style="text-align: center;">No visits yet. Check your Firebase rules!</td></tr>';
                }
            } catch (e) {
                console.error("Error fetching admin data:", e);
                document.getElementById('visitorTableBody').innerHTML = `<tr><td colspan="4" style="color:red; text-align:center;">Error loading data. Did you set Firestore to Test Mode?</td></tr>`;
            }
        }

        // =========================================================================
        // FESTIVE UI & WEB AUDIO API LOGIC
        // =========================================================================
        function initMainUI() {
            const playBtn = document.getElementById('playBtn');
            const pauseBtn = document.getElementById('pauseBtn');
            const resumeBtn = document.getElementById('resumeBtn');
            const controls = document.getElementById('controls');
            
            let audioCtx;
            let isPlaying = false;
            let intervalId;

            // Simple traditional-sounding scale frequencies (Raga-inspired)
            const notes = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25];
            
            function playMelody() {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                
                isPlaying = true;
                
                intervalId = setInterval(() => {
                    if(!isPlaying) return;
                    
                    const osc = audioCtx.createOscillator();
                    const gainNode = audioCtx.createGain();
                    
                    // Traditional flute-like tone
                    osc.type = 'sine'; 
                    const randomNote = notes[Math.floor(Math.random() * notes.length)];
                    osc.frequency.setValueAtTime(randomNote, audioCtx.currentTime);
                    
                    // Soft envelope
                    gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
                    gainNode.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + 0.1);
                    gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.5);
                    
                    osc.connect(gainNode);
                    gainNode.connect(audioCtx.destination);
                    
                    osc.start();
                    osc.stop(audioCtx.currentTime + 1.5);
                }, 400); // play a note every 400ms
            }

            playBtn.addEventListener('click', () => {
                playBtn.style.display = 'none';
                controls.style.display = 'block';
                playMelody();
                initSparkles();
            });

            pauseBtn.addEventListener('click', () => {
                isPlaying = false;
                clearInterval(intervalId);
                pauseBtn.style.display = 'none';
                resumeBtn.style.display = 'inline-block';
            });

            resumeBtn.addEventListener('click', () => {
                playMelody();
                resumeBtn.style.display = 'none';
                pauseBtn.style.display = 'inline-block';
            });

            // Canvas Particle Effects
            function initSparkles() {
                const canvas = document.getElementById('sparkles');
                const ctx = canvas.getContext('2d');
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;

                const particles = [];
                for(let i = 0; i < 100; i++) {
                    particles.push({
                        x: Math.random() * canvas.width,
                        y: Math.random() * canvas.height,
                        radius: Math.random() * 2 + 1,
                        vx: Math.random() * 1 - 0.5,
                        vy: Math.random() * -1 - 0.5,
                        alpha: Math.random()
                    });
                }

                function draw() {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    particles.forEach(p => {
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(244, 208, 63, ${p.alpha})`;
                        ctx.fill();
                        
                        p.x += p.vx;
                        p.y += p.vy;
                        p.alpha -= 0.005;
                        
                        // Reset particle when it fades
                        if(p.alpha <= 0 || p.y < 0) {
                            p.y = canvas.height;
                            p.x = Math.random() * canvas.width;
                            p.alpha = Math.random();
                        }
                    });
                    if(isPlaying) {
                        requestAnimationFrame(draw);
                    }
                }
                draw();
            }
            
            window.addEventListener('resize', () => {
                const canvas = document.getElementById('sparkles');
                if(canvas) {
                    canvas.width = window.innerWidth;
                    canvas.height = window.innerHeight;
                }
            });
        }
    </script>
</body>
</html>
